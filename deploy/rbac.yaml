---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-topology-api
  namespace: default
  labels:
    app.kubernetes.io/name: k8s-topology-dashboard
    app.kubernetes.io/component: api

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-topology-api
  labels:
    app.kubernetes.io/name: k8s-topology-dashboard
    app.kubernetes.io/component: api
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - nodes
      - pods
      - services
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: [get, list, watch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-topology-api
  labels:
    app.kubernetes.io/name: k8s-topology-dashboard
    app.kubernetes.io/component: api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-topology-api
subjects:
  - kind: ServiceAccount
    name: k8s-topology-api
    namespace: default
